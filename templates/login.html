{% extends 'base.html' %}
{% block title %}Coach login | Three Feathers{% endblock %}
{% block content %}
<div class="narrow" style="margin-top:40px">
<h2>Coach login</h2>
<p class="lede">Enter the coach password to add or change information.</p>
<div class="panel"><form method="post">{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
<label>Password<input type="password" name="password" required autofocus autocomplete="current-password"></label>
{% if error %}<p class="errorlist" role="alert">{{ error }}</p>{% endif %}
<button class="btn" type="submit">Unlock</button>
</form></div></div>
{% endblock %}
